<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <!-- Dark Sci-Fi Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Node Gradients -->
    <linearGradient id="unityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>

    <linearGradient id="cvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="ekfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="pidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>

    <linearGradient id="metricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="560" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Overlay -->
  <g opacity="0.1" stroke="#00f0ff" stroke-width="0.5">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#00f0ff" stroke-width="0.5"/>
    </pattern>
    <rect width="950" height="560" fill="url(#grid)" />
  </g>

  <!-- Header -->
  <text x="35" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#00f0ff" letter-spacing="2">
    ⚡ PERCEPTX HARDWARE-IN-THE-LOOP (HIL) PIPELINE ARCHITECTURE
  </text>
  <text x="35" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
    ISRO PS 169 • Real-Time Closed-Loop Control @ 30Hz Nominal (300-464 FPS Processing Engine)
  </text>

  <!-- Animated Data Connection Lines -->
  <!-- Line 1: Unity -> CV Engine -->
  <path d="M 230 180 L 230 250 L 350 250" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite" />
  </path>
  
  <!-- Line 2: CV Engine -> EKF -->
  <path d="M 570 250 L 670 250" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite" />
  </path>

  <!-- Line 3: EKF -> PID Controller -->
  <path d="M 780 300 L 780 390 L 670 390" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite" />
  </path>

  <!-- Line 4: PID Controller -> Unity Feedback Loop -->
  <path d="M 350 390 L 130 390 L 130 220" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="0.8s" repeatCount="indefinite" />
  </path>

  <!-- Line 5: Telemetry to Logger -->
  <path d="M 510 320 L 510 470 L 670 470" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="1s" repeatCount="indefinite" />
  </path>

  <!-- MODULE 1: UNITY SIMULATOR -->
  <g transform="translate(30, 100)">
    <rect width="200" height="120" rx="10" fill="url(#unityGrad)" stroke="#6366f1" stroke-width="2" filter="url(#glow)" />
    <text x="15" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc">MODULE 1: UNITY 3D</text>
    <text x="15" y="50" font-family="monospace" font-size="11" fill="#c7d2fe">• 640x480 Monochrome FPA</text>
    <text x="15" y="68" font-family="monospace" font-size="11" fill="#c7d2fe">• 4 Motion Profiles</text>
    <text x="15" y="86" font-family="monospace" font-size="11" fill="#c7d2fe">• S&P / Noise / Fog Injector</text>
    <text x="15" y="104" font-family="monospace" font-size="11" fill="#c7d2fe">• TCP Server :5005 @ 30Hz</text>
  </g>

  <!-- MODULE 3: HYBRID PERCEPTION ENGINE -->
  <g transform="translate(350, 180)">
    <rect width="220" height="140" rx="10" fill="url(#cvGrad)" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <text x="15" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7">MODULE 3: CV/AI ENGINE</text>
    <rect x="15" y="38" width="190" height="38" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1" />
    <text x="22" y="54" font-family="monospace" font-size="10" font-weight="bold" fill="#a7f3d0">FAST PATH: Top-Hat + Subpixel</text>
    <text x="22" y="68" font-family="monospace" font-size="9" fill="#6ee7b7">Latency: 1-3 ms (300+ FPS)</text>
    
    <rect x="15" y="84" width="190" height="42" rx="4" fill="#047857" stroke="#10b981" stroke-width="1" />
    <text x="22" y="100" font-family="monospace" font-size="10" font-weight="bold" fill="#ecfdf5">AI FALLBACK: YOLOv8n ONNX</text>
    <text x="22" y="114" font-family="monospace" font-size="9" fill="#a7f3d0">Low SNR / Severe Fog Fallback</text>
  </g>

  <!-- MODULE 4: KALMAN STATE ESTIMATOR -->
  <g transform="translate(670, 180)">
    <rect width="220" height="120" rx="10" fill="url(#ekfGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" />
    <text x="15" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">MODULE 4: 6D EKF ESTIMATOR</text>
    <text x="15" y="52" font-family="monospace" font-size="11" fill="#bfdbfe">• State: [x, y, vx, vy, ax, ay]</text>
    <text x="15" y="70" font-family="monospace" font-size="11" fill="#bfdbfe">• Jitter Filter (±20 px/frame)</text>
    <text x="15" y="88" font-family="monospace" font-size="11" fill="#bfdbfe">• Dead-Reckoning (≤ 1.0s)</text>
    <text x="15" y="106" font-family="monospace" font-size="11" fill="#bfdbfe">• Dynamic Covariance Adaptation</text>
  </g>

  <!-- MODULE 5: PID CONTROL & REACQUISITION -->
  <g transform="translate(350, 340)">
    <rect width="320" height="100" rx="10" fill="url(#pidGrad)" stroke="#d946ef" stroke-width="2" filter="url(#glow)" />
    <text x="15" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f5d0fe">MODULE 5: PID CONTROL &amp; REACQUISITION</text>
    <text x="15" y="50" font-family="monospace" font-size="11" fill="#f0abfc">• Pixel-to-Angle (0.00625°/px) • Anti-Windup Clamping</text>
    <text x="15" y="68" font-family="monospace" font-size="11" fill="#f0abfc">• Slew Rate Limit: STRICT 5.0°/s MAX</text>
    <text x="15" y="86" font-family="monospace" font-size="11" fill="#f0abfc">• Archimedean Spiral Search FSM (Re-acq ≤ 1.0s)</text>
  </g>

  <!-- MODULE 6: METRICS & LOGGER -->
  <g transform="translate(670, 420)">
    <rect width="220" height="90" rx="10" fill="url(#metricGrad)" stroke="#f97316" stroke-width="2" filter="url(#glow)" />
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fed7aa">MODULE 6: METRIC LOGGER</text>
    <text x="15" y="46" font-family="monospace" font-size="10" fill="#ffedd5">• Real-time RMSE &amp; Centroid Error</text>
    <text x="15" y="62" font-family="monospace" font-size="10" fill="#ffedd5">• Lock Retention Rate (&gt; 95%)</text>
    <text x="15" y="78" font-family="monospace" font-size="10" fill="#ffedd5">• Auto CSV / JSON Report Exporter</text>
  </g>

  <!-- Data Flow Labels -->
  <g font-family="monospace" font-size="10" font-weight="bold">
    <!-- Frame Stream -->
    <rect x="235" y="200" width="105" height="22" rx="4" fill="#0f172a" stroke="#00f0ff" />
    <text x="242" y="215" fill="#00f0ff">Raw RGB @ 30Hz</text>

    <!-- Detection Coordinates -->
    <rect x="575" y="225" width="90" height="22" rx="4" fill="#0f172a" stroke="#10b981" />
    <text x="580" y="240" fill="#10b981">(u, v) + Conf</text>

    <!-- State Vector -->
    <rect x="700" y="325" width="120" height="22" rx="4" fill="#0f172a" stroke="#3b82f6" />
    <text x="705" y="340" fill="#60a5fa">[x, y, vx, vy, ax, ay]</text>

    <!-- Gimbal Command Uplink -->
    <rect x="160" y="365" width="160" height="22" rx="4" fill="#0f172a" stroke="#f43f5e" />
    <text x="166" y="380" fill="#f43f5e">Pan/Tilt Delta (Max 5°/s)</text>
  </g>
</svg>
